    <script>
      (() => {
        let saved = null
        try { saved = localStorage.getItem('x-md-theme') } catch {}
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#11120f' : '#f7f6f2')
      })()
    </script>

                "name": "Do I need an X or Twitter API key to use x.md?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. The hosted service reads public X content through public upstream providers, so there is no X API key, no developer account, and no sign-in of any kind. Rate limits take the place of authentication."
                }

                "@type": "Question",
                "name": "Does it return whole threads, or only a single post?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Whole threads by default. A status URL returns the conversation: parent posts, the author thread numbered in order, and top replies. Add ?thread=off for only the requested post, or ?context=thread to leave out unrelated replies."
                }
              },

                "@type": "Question",

                  "@type": "Answer",

                }
              },

                "@type": "Question",
                "name": "Is there a rate limit?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Live search is the scarce path: public callers get 5 uncached searches per minute per IP address, plus a further per-IP budget over a fifteen-minute window. Post and profile reads are cached for an hour by default, so repeat reads of the same URL usually never reach upstream."
                }
              },
              {
                "@type": "Question",
                "name": "Can x.md post, reply, follow, or like on my behalf?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. x.md is strictly read-only. It has no write path to X, never holds your credentials, and cannot act on any account."
