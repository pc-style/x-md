<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/satoshi-900-f4d41ea8.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="description"
      content="Learn who maintains x.md, why it turns public X content into Markdown, and how the free, open-source project works. Independent and not affiliated with X."
    />
    <meta name="author" content="x.md contributors" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#080b09" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let saved = null
        // One key for the landing page and the Blume docs, so the theme carries
        // across without a flash. x-md-theme is the landing page's old key.
        // Dark is the default; only an explicit choice of light overrides it.
        try {
          saved = localStorage.getItem('blume-theme')
          const legacy = localStorage.getItem('x-md-theme')
          if (!saved && legacy) localStorage.setItem('blume-theme', (saved = legacy))
          localStorage.removeItem('x-md-theme')
        } catch {}
        const dark = saved !== 'light'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#080b09' : '#f7f6f2')
      })()
    </script>
    <title>About x.md — Open-source X to Markdown</title>
