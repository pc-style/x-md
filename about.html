<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="x.md is a free, read-only service that turns public X posts, threads, profiles, and search results into Markdown for agents. Open source, MIT-licensed, maintained by one independent developer, and not affiliated with X Corp."
    />
    <meta name="author" content="x.md contributors" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let saved = null
        try { saved = localStorage.getItem('x-md-theme') } catch {}
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#11120f' : '#f7f6f2')
      })()
    </script>
    <title>About x.md</title>
    <link rel="canonical" href="https://x.pcstyle.dev/about" />
    <link rel="alternate" type="text/markdown" href="/about.md" title="About as Markdown" />
    <link rel="alternate" hreflang="en" href="https://x.pcstyle.dev/about" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="x.md" />
