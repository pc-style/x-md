name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun --bun tsc
      - name: Test
        run: bun run test
      - name: Skill CLI smoke
        run: bun skills/browse-x/scripts/browse-x.ts --help
      # Before Build, which regenerates both files in place: these catch a stale committed copy.
      - name: openapi.json matches lib/openapi.ts
        run: bun run openapi:check
      - name: SDK matches openapi.json
        run: bun run sdk:check
      - name: SDK type-check and build
        run: bun --bun tsc -p packages/sdk && bun run --cwd packages/sdk build
      - name: Build
        run: bun run build
