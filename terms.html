<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plain-language terms for x.md: a free, read-only, MIT-licensed public service provided as is with no warranty, rate limits that may change, no affiliation with X Corp, and your responsibility to comply with X's own terms."
    />
    <meta name="author" content="x.md contributors" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let saved = null
        try { saved = localStorage.getItem('x-md-theme') } catch {}
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#11120f' : '#f7f6f2')
      })()
    </script>
    <title>Terms of use — x.md</title>
    <link rel="canonical" href="https://x.pcstyle.dev/terms" />
    <link rel="alternate" type="text/markdown" href="/terms.md" title="Terms as Markdown" />
    <link rel="alternate" hreflang="en" href="https://x.pcstyle.dev/terms" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="x.md" />
    <meta property="og:title" content="Terms of use — x.md" />
    <meta property="og:description" content="Free, as-is, read-only. Rate limits may change, and you remain responsible for complying with X's own terms." />
    <meta property="og:url" content="https://x.pcstyle.dev/terms" />
    <meta property="og:image" content="https://x.pcstyle.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="x.md: convert public X posts to Markdown" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Terms of use — x.md" />
    <meta name="twitter:description" content="Free, as-is, read-only. Rate limits may change, and you remain responsible for complying with X's own terms." />
    <meta name="twitter:image" content="https://x.pcstyle.dev/og.png" />
    <meta name="twitter:image:alt" content="x.md: convert public X posts to Markdown" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": "https://x.pcstyle.dev/terms#webpage",
            "url": "https://x.pcstyle.dev/terms",
            "name": "Terms of use — x.md",
            "description": "Plain-language terms for x.md: a free, read-only, MIT-licensed public service provided as is with no warranty, rate limits that may change, no affiliation with X Corp, and your responsibility to comply with X's own terms.",
            "inLanguage": "en-US",
            "isPartOf": {
              "@id": "https://x.pcstyle.dev/#website"
            },
            "about": {
              "@id": "https://x.pcstyle.dev/#organization"
            },
            "publisher": {
              "@id": "https://x.pcstyle.dev/#organization"
            },
            "breadcrumb": {
              "@id": "https://x.pcstyle.dev/terms#breadcrumb"
            },
            "encoding": {
              "@type": "MediaObject",
              "contentUrl": "https://x.pcstyle.dev/terms.md",
              "encodingFormat": "text/markdown"
            }
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://x.pcstyle.dev/terms#breadcrumb",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",

          }
        ]
      }
    </script>

</html>
